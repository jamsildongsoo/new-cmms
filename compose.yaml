# 개발·배포 공통. backend/.env: 개발 NODE_ENV=development, 운영 production.
# DB_SYNCHRONIZE: 개발 true/false, 운영 false. 초기 설정은 ./bootstrap.sh, 시작은 ./start.sh.
name: new-cmms
services:
  backend:
    image: ${CMMS_BACKEND_IMAGE:-cmms-backend:local}
    pull_policy: never
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    env_file: backend/.env
    # Docker 내부 통신 규약. backend/.env의 동일 항목보다 우선한다.
    environment:
      PORT: "3000"
      API_PREFIX: api
      TRUST_PROXY_HOPS: "1"
      FILE_STORAGE_DRIVER: local
      FILE_LOCAL_ROOT: /app/uploads
    expose:
      - "3000"
    volumes:
      - type: bind
        source: ${UPLOADS_HOST_PATH:-./backend/uploads}
        target: /app/uploads
        bind:
          create_host_path: false
      - type: bind
        source: ${DB_CERTS_HOST_PATH:-./deploy/db-certs}
        target: /app/certs
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  nginx:
    image: ${CMMS_FRONTEND_IMAGE:-cmms-frontend:local}
    pull_policy: never
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # 개발 기본 HTTP 80. 운영 전환 시 443 매핑과 루트 .env의 HTTPS 설정을 활성화한다.
    # HTTPS 전환 후 80을 유지하면 리다이렉트용으로 사용하며, 필요 없으면 80 매핑을 주석 처리한다.
    ports:
      - "${CMMS_BIND_ADDRESS:-127.0.0.1}:${CMMS_HTTP_PORT:-80}:80"
      # - "${CMMS_BIND_ADDRESS:-127.0.0.1}:${CMMS_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ${CMMS_NGINX_CONFIG:-./deploy/nginx/default.conf}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_CERT_DIR:-./deploy/tls}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
