root /usr/share/nginx/html;
index index.html;
server_tokens off;
# 기본 NestJS 합계 제한은 50 MiB이다. multipart 경계를 포함하여 Nginx는 60 MiB로 둔다.
client_max_body_size 60m;
client_body_timeout 120s;
resolver 127.0.0.11 valid=10s ipv6=off;
# backend 컨테이너 재생성 후 바뀐 IP도 Docker DNS로 다시 조회한다.
set $cmms_backend http://backend:3000;

location = /api {
    proxy_pass $cmms_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /api/ {
    # 끝에 /를 붙이지 않아 /api prefix를 그대로 전달한다.
    proxy_pass $cmms_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header Cache-Control "no-store" always;
}
# 업로드 폴더를 정적 공개하지 않는다. 다운로드는 JWT가 필요한 첨부 API만 사용한다.
location = /uploads { return 404; }
location ^~ /uploads/ { return 404; }
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
