map $http_upgrade $cmms_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 60m;
    client_body_timeout 120s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cmms_backend http://backend:3000;
    set $cmms_frontend http://frontend:5173;

    location = /api {
        proxy_pass $cmms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass $cmms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store" always;
    }
    location = /uploads { return 404; }
    location ^~ /uploads/ { return 404; }
    location / {
        proxy_pass $cmms_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cmms_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
