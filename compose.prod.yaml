services:
  nginx:
    volumes:
      - type: bind
        source: ./deploy/nginx/https.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_CERT_DIR:-./deploy/tls}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
