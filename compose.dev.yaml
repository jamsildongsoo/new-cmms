name: new-cmms
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    init: true
    env_file: backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      API_PREFIX: api
      FILE_STORAGE_DRIVER: local
      FILE_LOCAL_ROOT: /app/uploads
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    expose:
      - "3000"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/tsconfig.json:/app/tsconfig.json:ro
      - ./backend/tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./backend/nest-cli.json:/app/nest-cli.json:ro
      - type: bind
        source: ${UPLOADS_HOST_PATH:-./data/uploads}
        target: /app/uploads
        bind:
          create_host_path: false
      - type: bind
        source: ${DB_CERTS_HOST_PATH:-./deploy/db-certs}
        target: /app/certs
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    init: true
    env_file: frontend/.env
    environment:
      NODE_ENV: development
      API_PROXY_TARGET: http://backend:3000
      CMMS_USE_POLLING: "true"
    expose:
      - "5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
  nginx:
    image: nginx:stable-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${CMMS_BIND_ADDRESS:-127.0.0.1}:${CMMS_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/development.conf:/etc/nginx/conf.d/default.conf:ro
